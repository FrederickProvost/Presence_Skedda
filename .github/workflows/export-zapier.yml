name: Export Presence Skedda

on:
  schedule:
    - cron: "50 08 * * *"
      timezone: "America/Toronto"

    - cron: "50 12 * * *"
      timezone: "America/Toronto"

    - cron: "50 14 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show trigger information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC time:"
          date -u
          echo "Toronto time:"
          TZ=America/Toronto date

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Zapier export
        env:
          ZAPIER_TABLE_URL: ${{ secrets.ZAPIER_TABLE_URL }}
        run: |
          python main.py

      - name: Verify CSV
        run: |
          ls -la
          test -f Presence_Skedda.csv
          echo "Presence_Skedda.csv created successfully"

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Presence_Skedda.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Presence_Skedda.csv"
            git push
          fi
