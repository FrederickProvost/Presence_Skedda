name: Export Presence Skedda

on:
  workflow_dispatch:

  schedule:
    # 8:50 Toronto lorsque Toronto est à UTC-4
    - cron: "50 12 * * *"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Zapier export
        env:
          ZAPIER_TABLE_URL: ${{ secrets.ZAPIER_TABLE_URL }}
        run: |
          python main.py

      - name: Verify CSV
        run: |
          ls -la
          test -f Presence_Skedda.csv
          echo "Presence_Skedda.csv created successfully"

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Presence_Skedda.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Presence_Skedda.csv"
            git push
          fi
